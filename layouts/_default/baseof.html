<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
{{- partial "head.html" . -}}

<body>
  {{- block "main" . }}{{- end }}
  {{- partial "footer.html" . -}}

  <!-- The main JavaScript file for HugoScroll -->
  {{ $js := resources.Get "js/index.js" | resources.Minify | resources.Fingerprint }}

  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous"></script>

</body>

</html>
