{{- /* Inline SVG icon, sized to the surrounding text (1em). Usage: {{ partial "icon.html" "chevron-left" }} */ -}}
{{- $shapes := dict
  "angle-down" `<polyline points="6 9 12 15 18 9"/>`
  "arrow-right" `<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>`
  "chevron-left" `<polyline points="15 18 9 12 15 6"/>`
-}}
<svg class="icon icon-{{ . }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{{ index $shapes . | safeHTML }}</svg>
